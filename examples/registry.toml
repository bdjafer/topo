# examples/registry.toml
#
# Single source of truth for all topo dataset repos.
# Each [[example]] entry defines a real codebase to parse and analyze.
#
# Source code is never stored — this file records URL + pinned commit SHA.
# Artifacts are generated by scripts and stored in examples/<name>/ or
# benchmark/corpus/<name>/ depending on the workflow.
#
# Repos with cached artifacts in examples/ have analysis.json + analysis.txt
# committed to the repo. Benchmark corpus artifacts are gitignored.

[defaults]
edge_kind = "combined"
level = "module"
scope = "first-party"

# ──────────────────────────────────────────────────────────────
# Python — Small
# ──────────────────────────────────────────────────────────────

[[example]]
name = "flask"
repo = "https://github.com/pallets/flask"
commit = "2f8c0e3"  # tag 3.1.0
ref = "3.1.0"
language = "python"
entrypoint = "src/flask"
description = "Python micro web framework. Layered design with sansio abstraction."

[example.tags]
size = "small"
quality = "clean"
pattern = ["layered", "sansio", "plugin-system"]

