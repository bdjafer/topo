# examples/registry.toml
#
# Central manifest for all topo example analyses.
# Each [[example]] entry defines a real codebase to analyze.
#
# Source code is never stored — this file records URL + pinned commit SHA.
# Artifacts (graph.json, analysis.json, analysis.txt, metadata.json) are
# generated by scripts/fetch_and_analyze.sh and committed.

[defaults]
edge_kind = "combined"
level = "module"
scope = "first-party"

# ──────────────────────────────────────────────────────────────
# Python — Small
# ──────────────────────────────────────────────────────────────

[[example]]
name = "flask"
repo = "https://github.com/pallets/flask"
commit = "2f8c0e3"  # tag 3.1.0
ref = "3.1.0"
language = "python"
entrypoint = "src/flask"
description = "Python micro web framework. Layered design with sansio abstraction."

[example.tags]
size = "small"
quality = "clean"
pattern = ["layered", "sansio", "plugin-system"]

[[example]]
name = "click"
repo = "https://github.com/pallets/click"
commit = "a281a06"  # tag 8.1.8
ref = "8.1.8"
language = "python"
entrypoint = "src/click"
description = "Python CLI framework. Flat single-package library."

[example.tags]
size = "small"
quality = "clean"
pattern = ["flat-library", "decorator-api"]

[[example]]
