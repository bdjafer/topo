[project]
name = "topo"
version = "0.1.0"
description = "Structural intelligence for codebases — spectral analysis of code topology"
requires-python = ">=3.11"
dependencies = [
    "pycg",
    "topo-parser-python",
    "topo-analyzer",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=7.0",
]

[tool.uv.workspace]
members = ["packages/*"]
exclude = ["packages/topo-web", "packages/topo-cli", "packages/topo-parser", "packages/topo-parser-rust", "packages/topo-benchmark", "packages/topo-cache", "packages/topo-formatter"]

[tool.uv.sources]
pycg = { workspace = true }
topo-parser-python = { workspace = true }
topo-analyzer = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/test_benchmark"

[tool.mypy]
python_version = "3.11"
strict = true
