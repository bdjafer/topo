[project]
name = "topo"
version = "0.1.0"
description = "Structural intelligence for codebases — spectral analysis of code topology"
requires-python = ">=3.11"
dependencies = [
    "pycg",
    "topo-parser",
    "topo-analyzer",
    "topo-cli",
    "topo-benchmark",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[tool.uv.workspace]
members = ["packages/*"]
exclude = ["packages/topo-web"]

[tool.uv.sources]
pycg = { workspace = true }
topo-parser = { workspace = true }
topo-analyzer = { workspace = true }
topo-cli = { workspace = true }
topo-benchmark = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
