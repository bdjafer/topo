[package]
name = "topo-cli-rs"
version = "0.1.0"
edition = "2024"
description = "Rust CLI for topo structural analysis"

[[bin]]
name = "topo"
path = "src/main.rs"

[dependencies]
topo-analyzer = { path = "../topo-analyzer", default-features = false }
topo-parser-rs = { path = "../topo-parser-rs" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
owo-colors = "4"
anyhow = "1"
