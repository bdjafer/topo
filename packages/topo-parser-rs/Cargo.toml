[package]
name = "topo-parser-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "topo_parser_rs"

[dependencies]
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
toml = "0.8"
anyhow = "1"
