[project]
name = "topo-cli"
version = "0.1.0"
description = "Developer-facing CLI for structural intelligence"
requires-python = ">=3.11"
dependencies = [
    "topo-parser",
    "topo-analyzer",
]

[project.scripts]
topo = "topo_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/topo_cli"]

[tool.uv.sources]
topo-parser = { workspace = true }
topo-analyzer = { workspace = true }
