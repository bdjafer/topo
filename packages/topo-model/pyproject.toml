[project]
name = "topo-model"
version = "0.1.0"
description = "R-GIN model for structural code intelligence"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "torch-geometric>=2.4",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "tqdm>=4.60",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
wandb = ["wandb>=0.16"]

[dependency-groups]
dev = ["pytest>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/topo_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
