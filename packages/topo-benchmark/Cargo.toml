[package]
name = "topo-benchmark"
version = "0.1.0"
edition = "2024"
description = "Benchmark harness for topo-analyzer"

[[bin]]
name = "topo-benchmark"
path = "src/main.rs"

[lib]
name = "topo_benchmark"

[dependencies]
topo-analyzer = { path = "../topo-analyzer", default-features = false }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
