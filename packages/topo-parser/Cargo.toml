[package]
name = "topo-parser"
version = "0.1.0"
edition = "2024"
description = "Unified parser — graph types, language detection, multi-language dispatch"

[lib]
name = "topo_parser"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
topo-parser-rust = { path = "../topo-parser-rust", optional = true }

[features]
default = []
rust = ["topo-parser-rust"]
