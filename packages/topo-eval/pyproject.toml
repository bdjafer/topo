[project]
name = "topo-eval"
version = "0.1.0"
description = "Self-supervised evaluation pipeline for R-GIN structural code intelligence"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "torch-geometric>=2.4",
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
]

[dependency-groups]
dev = ["pytest>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/topo_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
